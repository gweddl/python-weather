<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} Weather</title>
    <link href="{{ url_for('static', filename='styles/style.css'
    )}}" rel="stylesheet" />
</head>
<body>
    <h1>{{ title }} Weather</h1>
    <p>{{ status }} and {{ temp }} &deg;     Feels like {{ feels_like }} &deg;</p>
    <p>Humidity {{ humidity }} %</p>
    <p>Pressure {{ pressure  }} millibars</p>
    <p>Wind speed {{ wind_speed }} mi/hr.</p>
    <p>Location:&nbsp;&nbsp;{{ lat }} &nbsp;&nbsp;{{ lon }}</p>
    

    <form action="/weather">
        <input type="text" name="city" id="city"
        placeholder="Enter a City" />
        <button type="submit">Submit</button>
    </form>
</body>
</html>
